services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wsr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wsr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Application containers: start with `docker compose --profile app up -d --build`
  migrate:
    profiles: ["app"]
    build: ./backend
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wsr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wsr}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wsr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wsr}
      APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH:?Set APP_ADMIN_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-8}
      TRUST_PROXY: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    profiles: ["app"]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
